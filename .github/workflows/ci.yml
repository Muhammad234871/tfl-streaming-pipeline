name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Java 21 (for Spark)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install project with dev and Spark dependencies
        run: pip install -e ".[dev,spark]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      - name: Run tests
        run: pytest -v

  dags:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Airflow gets its own environment (as locally), installed with its official constraints.
      - name: Install Airflow 3.3.2 and pytest
        run: >
          pip install "apache-airflow==3.3.2" pytest
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt"

      - name: Test DAG structure
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: pytest tests/test_dags.py -v

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Check formatting (terraform fmt)
        run: terraform fmt -check -recursive

      - name: Init (no backend, no AWS access)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

