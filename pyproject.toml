[project]
name = "tfl-pipeline"
version = "0.1.0"
description = "Real-time London transport data pipeline: TfL API -> Kafka -> S3 data lake"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
